services:
  medicalreports.api:
    container_name: medicalreports.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MedicalReportsConnectionString=Server=medicalreportsdb;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true
    ports:
      - "8001:8080"
    depends_on:
      medicalreportsdb:
        condition: service_healthy
        
  medicalreportsdb:
    container_name: medicalreportsdb
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${DB_USER} -P ${DB_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s